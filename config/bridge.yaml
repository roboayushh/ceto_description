# --- STATE & SENSORS (GZ -> ROS) ---

- topic_name: "/model/bluerov2/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"

- topic_name: "/model/bluerov2/odometry_with_covariance"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.OdometryWithCovariance"
  direction: "GZ_TO_ROS"

- topic_name: "/model/bluerov2/sea_pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "gz.msgs.FluidPressure"
  direction: "GZ_TO_ROS"

- topic_name: "/model/bluerov2/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"

- topic_name: "/model/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: "GZ_TO_ROS"

- topic_name: "/world/pool_world/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"

# --- TRANSFORMS & JOINTS (GZ -> ROS) ---

# Bridge Model Pose to TF (handles map -> base_link)
- ros_topic_name: "/tf"
  gz_topic_name: "/model/bluerov2/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/pool_world/model/bluerov2/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"